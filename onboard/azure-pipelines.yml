# Export apps installed on the stack into their empty repositories and create their pipelines.
trigger: none
pr: none

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: target
    displayName: Variable groups - splunk-itsi uses splunk-itsi-<env>, splunk uses splunk-<env>
    type: string
    default: splunk-itsi
    values:
      - splunk-itsi
      - splunk
  - name: apps
    displayName: App IDs separated by ;. Create an empty repository named after each app first
    type: string

variables:
  appIds: ${{ replace(replace(trim(parameters.apps), '; ', ';'), ' ', ';') }}

# One repository resource per app, named after the app.
resources:
  repositories:
    - ${{ each app in split(variables.appIds, ';') }}:
        - ${{ if ne(app, '') }}:
            - repository: app_${{ replace(replace(app, '-', '_'), '.', '_') }}
              type: git
              name: ${{ app }}

jobs:
  - ${{ each app in split(variables.appIds, ';') }}:
      - ${{ if ne(app, '') }}:
          - job: onboard_${{ replace(replace(app, '-', '_'), '.', '_') }}
            displayName: Onboard ${{ app }}
            workspace:
              clean: all
            uses:
              repositories:
                - app_${{ replace(replace(app, '-', '_'), '.', '_') }}
            variables:
              - group: ${{ parameters.target }}-${{ parameters.environment }}
            steps:
              - template: ../templates/python.yml
              - template: ../templates/diff-tools.yml
              - template: ../templates/acs-cli.yml
                parameters:
                  releaseScript: $(Build.SourcesDirectory)/release.py
              - template: ../templates/acs-step.yml
                parameters:
                  command: release.py onboard ${{ app }}
                  displayName: Export ${{ app }} from ${{ parameters.target }}-${{ parameters.environment }} into its repository and create its pipeline
                  additionalEnv:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
