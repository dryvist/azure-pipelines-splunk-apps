# Create an app repository and pipeline from an app installed on the stack.
trigger: none
pr: none

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: app
    displayName: App ID
    type: string
  - name: repository
    displayName: Repository name
    type: string
    default: ''
  - name: permissions
    displayName: Grant app repository permissions
    type: boolean
    default: true

jobs:
  - job: onboard
    displayName: Onboard ${{ parameters.app }}
    workspace:
      clean: all
    variables:
      - group: splunk-${{ parameters.environment }}
    steps:
      - template: ../templates/python.yml
      - template: ../templates/diff-tools.yml
      - template: ../templates/acs-cli.yml
        parameters:
          releaseScript: $(Build.SourcesDirectory)/release.py
      - template: ../templates/acs-step.yml
        parameters:
          command: release.py export export ${{ parameters.app }}
          displayName: Export ${{ parameters.app }} from ${{ parameters.environment }}
      - template: ../templates/acs-step.yml
        parameters:
          command: release.py onboard ${{ parameters.app }} "${{ parameters.repository }}" ${{ iif(parameters.permissions, '--permissions', '') }}
          displayName: Create the app repository and pipeline
          additionalEnv:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
