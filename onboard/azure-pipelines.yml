# Export apps installed on the stack into their repositories' empty package/ and create their pipelines.
# The run name shows the options this run started with.
name: "$(Date:yyyyMMdd).$(Rev:r) ${{ parameters.environment }} ${{ parameters.target }} ${{ iif(contains(parameters.apps, ';'), format('{0} apps', length(split(parameters.apps, ';'))), parameters.apps) }}"

trigger: none
pr: none

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: target
    displayName: Variable groups - splunk-itsi uses splunk-itsi-<env>, splunk uses splunk-<env>
    type: string
    default: splunk-itsi
    values:
      - splunk-itsi
      - splunk
  - name: apps
    displayName: App IDs separated by ;. Run the Onboard wiki script for each app first
    type: string

variables:
  appIds: ${{ replace(replace(trim(parameters.apps), '; ', ';'), ' ', ';') }}

jobs:
  - ${{ each app in split(variables.appIds, ';') }}:
      - ${{ if ne(app, '') }}:
          - job: onboard_${{ replace(replace(app, '-', '_'), '.', '_') }}
            displayName: Onboard ${{ app }}
            workspace:
              clean: all
            variables:
              - group: splunk-appinspect
              - group: ${{ parameters.target }}-${{ parameters.environment }}
            steps:
              - checkout: self
                path: tools
              - template: ../templates/python.yml
              - template: ../templates/diff-tools.yml
              - template: ../templates/acs-cli.yml
              - template: ../templates/acs-step.yml
                parameters:
                  command: release.py onboard ${{ app }}
                  workingDirectory: $(Pipeline.Workspace)/tools
                  displayName: Export ${{ app }} from ${{ parameters.target }}-${{ parameters.environment }} into its repository and create its pipeline
                  additionalEnv:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              # Checks out the app repository after the push to main.
              - checkout: git://${{ variables['System.TeamProject'] }}/${{ app }}
                path: app
