# Create an app repository and pipeline from an app installed on the stack.
trigger: none
pr: none

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: apps
    displayName: App IDs separated by ;. Each app gets a repository and pipeline named after it
    type: string
  - name: permissions
    displayName: Grant app repository permissions
    type: boolean
    default: true

variables:
  appIds: ${{ replace(replace(trim(parameters.apps), '; ', ';'), ' ', ';') }}

jobs:
  - ${{ each app in split(variables.appIds, ';') }}:
      - ${{ if ne(app, '') }}:
          - job: onboard_${{ replace(replace(app, '-', '_'), '.', '_') }}
            displayName: Onboard ${{ app }}
            workspace:
              clean: all
            variables:
              - group: splunk-${{ parameters.environment }}
            steps:
              - template: ../templates/python.yml
              - template: ../templates/diff-tools.yml
              - template: ../templates/acs-cli.yml
                parameters:
                  releaseScript: $(Build.SourcesDirectory)/release.py
              - template: ../templates/acs-step.yml
                parameters:
                  command: release.py export export ${{ app }}
                  displayName: Export ${{ app }} from ${{ parameters.environment }}
              - template: ../templates/acs-step.yml
                parameters:
                  command: release.py onboard ${{ app }} ${{ iif(parameters.permissions, '--permissions', '') }}
                  displayName: Create the ${{ app }} repository and pipeline
                  additionalEnv:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
