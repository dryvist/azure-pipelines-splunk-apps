# Keep this file identical across Splunk app repos. Shared logic is in
# azure-pipelines-splunk-apps. Azure Repos queues PR validation through a main
# branch Build validation policy and ignores YAML `pr:` triggers.
trigger:
  batch: true
  branches:
    include: [main]

resources:
  repositories:
    - repository: tools
      type: git
      # For another project in the org, set the name to
      # <project>/azure-pipelines-splunk-apps.
      name: azure-pipelines-splunk-apps

extends:
  template: templates/splunk-app.yml@tools
  parameters:
    target: splunk
