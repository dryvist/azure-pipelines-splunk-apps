trigger: none
pr: none

parameters:
  - name: target
    type: string
    default: splunk
    values:
      - splunk
      - splunk-itsi

jobs:
  - job: appinspect
    workspace:
      clean: all
    variables:
      - group: splunk-appinspect
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - script: python smoke-test/smoke_test.py appinspect
        displayName: Check AppInspect credentials
        env:
          SPLUNK_USERNAME: $(SPLUNK_USERNAME)
          SPLUNK_PASSWORD: $(SPLUNK_PASSWORD)

  - job: nonprod
    workspace:
      clean: all
    variables:
      - group: ${{ parameters.target }}-nonprod
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - template: ../templates/acs-cli.yml
        parameters:
          releaseScript: $(Build.SourcesDirectory)/release.py
      - script: python smoke-test/smoke_test.py ${{ parameters.target }}-nonprod
        displayName: Check nonprod ACS access and export
        env:
          SPLUNK_STACK: $(SPLUNK_STACK)
          SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
          ACS_TOKEN: $(ACS_TOKEN)

  - job: prod
    workspace:
      clean: all
    variables:
      - group: ${{ parameters.target }}-prod
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - template: ../templates/acs-cli.yml
        parameters:
          releaseScript: $(Build.SourcesDirectory)/release.py
      - script: python smoke-test/smoke_test.py ${{ parameters.target }}-prod
        displayName: Check prod ACS access and export
        env:
          SPLUNK_STACK: $(SPLUNK_STACK)
          SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
          ACS_TOKEN: $(ACS_TOKEN)

  - job: result
    workspace:
      clean: all
    dependsOn: [appinspect, nonprod, prod]
    condition: always()
    variables:
      appinspectResult: $[ dependencies.appinspect.result ]
      nonprodResult: $[ dependencies.nonprod.result ]
      prodResult: $[ dependencies.prod.result ]
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - script: python smoke-test/smoke_test.py result $(appinspectResult) $(nonprodResult) $(prodResult)
        displayName: Result
