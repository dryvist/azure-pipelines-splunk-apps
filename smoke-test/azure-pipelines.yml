trigger: none
pr: none

parameters:
  - name: target
    type: string
    default: splunk
    values:
      - splunk
      - splunk-itsi

jobs:
  - job: appinspect
    displayName: Check the AppInspect login
    workspace:
      clean: all
    variables:
      - group: splunk-appinspect
    steps:
      - template: ../templates/python.yml
      - script: python smoke-test/smoke_test.py appinspect
        displayName: Check AppInspect credentials
        env:
          SPLUNK_USERNAME: $(SPLUNK_USERNAME)
          SPLUNK_PASSWORD: $(SPLUNK_PASSWORD)

  - ${{ each env in split('nonprod prod', ' ') }}:
      - job: ${{ env }}
        displayName: Check ${{ env }} ACS access
        workspace:
          clean: all
        variables:
          - group: ${{ parameters.target }}-${{ env }}
        steps:
          - template: ../templates/python.yml
          - template: ../templates/acs-cli.yml
            parameters:
              releaseScript: $(Build.SourcesDirectory)/release.py
          - script: python smoke-test/smoke_test.py ${{ parameters.target }}-${{ env }}
            displayName: Check ${{ env }} ACS access and export
            env:
              SPLUNK_STACK: $(SPLUNK_STACK)
              SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
              SPLUNK_REST_URL: $(SPLUNK_REST_URL)
              ACS_TOKEN: $(ACS_TOKEN)

  - job: result
    displayName: Report the smoke-test result
    workspace:
      clean: all
    dependsOn: [appinspect, nonprod, prod]
    condition: always()
    variables:
      appinspectResult: $[ dependencies.appinspect.result ]
      nonprodResult: $[ dependencies.nonprod.result ]
      prodResult: $[ dependencies.prod.result ]
    steps:
      - checkout: self
      - template: ../templates/python.yml
      - script: python smoke-test/smoke_test.py result $(appinspectResult) $(nonprodResult) $(prodResult)
        displayName: Result
