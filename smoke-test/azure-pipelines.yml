trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
  - job: appinspect
    variables:
      - group: splunk-appinspect
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - script: python smoke-test/smoke_test.py appinspect
        displayName: Check AppInspect credentials
        env:
          SPLUNK_USERNAME: $(SPLUNK_USERNAME)
          SPLUNK_PASSWORD: $(SPLUNK_PASSWORD)

  - job: nonprod
    variables:
      - group: splunk-nonprod
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - script: python smoke-test/smoke_test.py nonprod
        displayName: Check nonprod ACS access
        env:
          SPLUNK_STACK: $(SPLUNK_STACK)
          ACS_TOKEN: $(ACS_TOKEN)

  - job: prod
    variables:
      - group: splunk-prod
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - script: python smoke-test/smoke_test.py prod
        displayName: Check prod ACS access and export
        env:
          SPLUNK_STACK: $(SPLUNK_STACK)
          ACS_TOKEN: $(ACS_TOKEN)

  - job: result
    dependsOn: [appinspect, nonprod, prod]
    condition: always()
    variables:
      appinspectResult: $[ dependencies.appinspect.result ]
      nonprodResult: $[ dependencies.nonprod.result ]
      prodResult: $[ dependencies.prod.result ]
    steps:
      - checkout: none
      - script: |
          echo "appinspect: $(appinspectResult)"
          echo "nonprod:    $(nonprodResult)"
          echo "prod:       $(prodResult)"
          if [ "$(appinspectResult)$(nonprodResult)$(prodResult)" = "SucceededSucceededSucceeded" ]; then
            echo "RESULT: ALL PASS"
          else
            echo "RESULT: FAILED - open each failed job for its FAIL or HTTP line"
            exit 1
          fi
        displayName: Result
