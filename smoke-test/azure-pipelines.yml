trigger: none
pr: none

parameters:
  - name: target
    type: string
    default: all
    values:
      - all
      - splunk
      - splunk-itsi

variables:
  targets: ${{ iif(eq(parameters.target, 'all'), 'splunk;splunk-itsi', parameters.target) }}

jobs:
  - job: appinspect
    displayName: Check the AppInspect login
    workspace:
      clean: all
    variables:
      - group: splunk-appinspect
    steps:
      - template: ../templates/python.yml
      - script: python smoke-test/smoke_test.py appinspect
        displayName: Check AppInspect credentials
        env:
          SPLUNK_USERNAME: $(SPLUNK_USERNAME)
          SPLUNK_PASSWORD: $(SPLUNK_PASSWORD)

  - ${{ each target in split(variables.targets, ';') }}:
      - ${{ each env in split('nonprod;prod', ';') }}:
          - job: ${{ replace(target, '-', '_') }}_${{ env }}
            displayName: Check ${{ target }}-${{ env }} ACS access
            workspace:
              clean: all
            variables:
              - group: ${{ target }}-${{ env }}
            steps:
              - template: ../templates/python.yml
              - template: ../templates/acs-cli.yml
                parameters:
                  releaseScript: $(Build.SourcesDirectory)/release.py
              - script: python smoke-test/smoke_test.py ${{ target }}-${{ env }}
                displayName: Check ${{ target }}-${{ env }} ACS access and export (no port 8089)
                env:
                  SPLUNK_STACK: $(SPLUNK_STACK)
                  SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
                  ACS_TOKEN: $(ACS_TOKEN)
              - script: python smoke-test/smoke_test.py rest ${{ target }}-${{ env }}
                displayName: Test port 8089 - read the search head REST API
                env:
                  SPLUNK_STACK: $(SPLUNK_STACK)
                  SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
                  ACS_TOKEN: $(ACS_TOKEN)

  - job: azuredevops
    displayName: Check Azure DevOps rights
    workspace:
      clean: all
    steps:
      - template: ../templates/python.yml
      - script: python smoke-test/smoke_test.py azuredevops
        displayName: Check onboard resources, feed and repository rights
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)
          SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
          BUILD_REPOSITORY_ID: $(Build.Repository.ID)

  - job: result
    displayName: Report the smoke-test result
    workspace:
      clean: all
    dependsOn:
      - appinspect
      - azuredevops
      - ${{ each target in split(variables.targets, ';') }}:
          - ${{ each env in split('nonprod;prod', ';') }}:
              - ${{ replace(target, '-', '_') }}_${{ env }}
    condition: always()
    variables:
      RESULT_appinspect: $[ dependencies.appinspect.result ]
      RESULT_azuredevops: $[ dependencies.azuredevops.result ]
      ${{ each target in split(variables.targets, ';') }}:
        ${{ each env in split('nonprod;prod', ';') }}:
          ${{ format('RESULT_{0}_{1}', replace(target, '-', '_'), env) }}: $[ dependencies.${{ replace(target, '-', '_') }}_${{ env }}.result ]
    steps:
      - checkout: self
      - template: ../templates/python.yml
      - script: python smoke-test/smoke_test.py result
        displayName: Result
