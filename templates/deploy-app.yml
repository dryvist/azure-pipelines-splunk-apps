# Download one app package from the splunk-apps feed, compare it with the stack, and optionally install it.
parameters:
  - name: app
    type: string
  - name: environment
    type: string
  - name: install
    type: boolean

steps:
  - checkout: self
    path: tools
  - template: python.yml
  - template: diff-tools.yml
  - template: acs-cli.yml
  - task: UniversalPackages@0
    displayName: Download ${{ lower(parameters.app) }} from the splunk-apps feed
    inputs:
      command: download
      feedsToUse: internal
      vstsFeed: $(System.TeamProject)/splunk-apps
      vstsFeedPackage: ${{ lower(parameters.app) }}
      vstsPackageVersion: '*'
      downloadDirectory: $(Pipeline.Workspace)/packages/${{ lower(parameters.app) }}
  - template: deploy.yml
    parameters:
      environment: ${{ parameters.environment }}
      packageDirectory: $(Pipeline.Workspace)/packages/${{ lower(parameters.app) }}
      install: ${{ parameters.install }}
