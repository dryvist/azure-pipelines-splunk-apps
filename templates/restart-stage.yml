# One stage that restarts the ITSI search head, then the main search head, of an environment.
# Without force, each search head restarts only when ACS reports a restart is required.
parameters:
  - name: name
    type: string
  - name: displayName
    type: string
  - name: environment
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: force
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    lockBehavior: sequential
    jobs:
      - ${{ each target in split('splunk-itsi splunk', ' ') }}:
        - deployment: ${{ replace(target, '-', '_') }}
          displayName: Restart ${{ iif(eq(target, 'splunk'), '', 'itsi-') }}${{ parameters.environment }} ${{ iif(parameters.force, 'after the uninstalls', 'if required') }}
          ${{ if eq(target, 'splunk') }}:
            dependsOn: splunk_itsi
          workspace:
            clean: all
          environment: splunk-${{ parameters.environment }}
          variables:
            - group: ${{ target }}-${{ parameters.environment }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    path: tools
                  - template: python.yml
                  - template: acs-cli.yml
                  - template: acs-step.yml
                    parameters:
                      command: '"$(Pipeline.Workspace)/tools/release.py" restart ${{ iif(parameters.force, ''--force'', '''') }}'
                      displayName: Restart the current stack
                  - template: acs-step.yml
                    parameters:
                      command: '"$(Pipeline.Workspace)/tools/release.py" status'
                      displayName: Check stack status after restart
