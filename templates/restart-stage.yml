# One stage that restarts the ITSI search head, then the main search head, of an environment when ACS reports
# a restart is required, or every time with always.
parameters:
  - name: name
    type: string
  - name: displayName
    type: string
  - name: environment
    type: string
  - name: dependsOn
    type: object
    default: []
  # manual waits for a person to select Run stage.
  - name: trigger
    type: string
    default: automatic
    values: [automatic, manual]
  # true restarts each search head even when ACS reports no pending restart.
  - name: always
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    trigger: ${{ parameters.trigger }}
    lockBehavior: sequential
    jobs:
      - ${{ each target in split('splunk-itsi splunk', ' ') }}:
        - deployment: ${{ replace(target, '-', '_') }}
          displayName: Restart ${{ iif(eq(target, 'splunk'), '', 'itsi-') }}${{ parameters.environment }}${{ iif(parameters.always, '', ' if required') }}
          ${{ if eq(target, 'splunk') }}:
            dependsOn: splunk_itsi
          workspace:
            clean: all
          environment: splunk-${{ parameters.environment }}
          variables:
            - group: ${{ target }}-${{ parameters.environment }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    path: tools
                  - template: python.yml
                  - template: acs-cli.yml
                  - template: acs-step.yml
                    parameters:
                      command: '"$(Pipeline.Workspace)/tools/release.py" restart${{ iif(parameters.always, '' --always'', '''') }}'
                      displayName: ${{ iif(parameters.always, 'Restart', 'Restart if required') }}
                  - template: acs-step.yml
                    parameters:
                      command: '"$(Pipeline.Workspace)/tools/release.py" status'
                      displayName: Check stack status after restart
