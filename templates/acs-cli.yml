parameters:
  - name: releaseScript
    type: string
    default: $(Pipeline.Workspace)/tools/release.py

steps:
  - script: python ${{ parameters.releaseScript }} install-acs
    displayName: Install ACS CLI 2.26.0
  - script: python -c "import subprocess; subprocess.run(['acs', 'version'], check=True)"
    displayName: ACS CLI version
