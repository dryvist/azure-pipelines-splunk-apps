parameters:
  - name: command
    type: string
  - name: displayName
    type: string
  - name: workingDirectory
    type: string
    default: ''
  - name: additionalEnv
    type: object
    default: {}
  - name: continueOnError
    type: boolean
    default: false

steps:
  - script: python ${{ parameters.command }}
    displayName: ${{ parameters.displayName }}
    continueOnError: ${{ parameters.continueOnError }}
    ${{ if ne(parameters.workingDirectory, '') }}:
      workingDirectory: ${{ parameters.workingDirectory }}
    env:
      SPLUNK_STACK: $(SPLUNK_STACK)
      SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
      STACK_TOKEN: $(ACS_TOKEN)
      ${{ insert }}: ${{ parameters.additionalEnv }}
