# One stage that installs a package on an environment after its splunk-<environment> approval.
# target picks the variable groups: splunk uses splunk-<environment>, splunk-itsi uses splunk-itsi-<environment>.
parameters:
  - name: name
    type: string
  - name: displayName
    type: string
  - name: environment
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()
  # Empty uses the pipeline's default pool.
  - name: pool
    type: object
    default: ''
  # Steps that put release.py in $(Pipeline.Workspace)/tools and the package in packageDirectory.
  - name: steps
    type: stepList
  - name: packageDirectory
    type: string
  - name: uninstall
    type: boolean
    default: false
  - name: target
    type: string
    default: splunk
  # Steps that replace the standard install steps.
  - name: deploySteps
    type: stepList
    default: []

stages:
  - stage: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    lockBehavior: sequential
    jobs:
      # With uninstall, the app is uninstalled from the ITSI search head first, then from the main one.
      - ${{ if parameters.uninstall }}:
        - deployment: uninstall_itsi
          displayName: Uninstall from itsi-${{ parameters.environment }}
          ${{ if parameters.pool }}:
            pool: ${{ parameters.pool }}
          workspace:
            clean: all
          environment: splunk-${{ parameters.environment }}
          variables:
            - group: splunk-itsi-${{ parameters.environment }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - ${{ parameters.steps }}
                  - template: acs-cli.yml
                  - template: deploy.yml
                    parameters:
                      environment: itsi-${{ parameters.environment }}
                      packageDirectory: ${{ parameters.packageDirectory }}
                      compare: false
                      install: false
                      uninstall: true
      - deployment: deploy
        displayName: ${{ iif(parameters.uninstall, 'Uninstall and install on', 'Install on') }} ${{ parameters.environment }}
        ${{ if parameters.uninstall }}:
          dependsOn: uninstall_itsi
        ${{ if parameters.pool }}:
          pool: ${{ parameters.pool }}
        workspace:
          clean: all
        environment: splunk-${{ parameters.environment }}
        variables:
          - group: splunk-appinspect
          - group: ${{ parameters.target }}-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - ${{ parameters.steps }}
                - template: acs-cli.yml
                - ${{ if eq(length(parameters.deploySteps), 0) }}:
                  - template: deploy.yml
                    parameters:
                      environment: ${{ parameters.environment }}
                      packageDirectory: ${{ parameters.packageDirectory }}
                      compare: false
                      uninstall: ${{ parameters.uninstall }}
                - ${{ parameters.deploySteps }}
