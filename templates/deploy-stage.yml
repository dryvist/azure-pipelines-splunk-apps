# One stage that installs a package on an environment after its splunk-<environment> approval.
# target picks the variable groups: splunk uses splunk-<environment>, splunk-itsi uses splunk-itsi-<environment>.
parameters:
  - name: name
    type: string
  - name: displayName
    type: string
  - name: environment
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()
  # Empty uses the pipeline's default pool.
  - name: pool
    type: object
    default: ''
  # Steps that put release.py in $(Pipeline.Workspace)/tools and the package in packageDirectory.
  - name: steps
    type: stepList
  - name: packageDirectory
    type: string
  - name: uninstall
    type: boolean
    default: false
  - name: target
    type: string
    default: splunk
  # Steps that replace the standard install steps.
  - name: deploySteps
    type: stepList
    default: []

stages:
  - stage: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    lockBehavior: sequential
    jobs:
      - deployment: deploy
        displayName: Install on ${{ parameters.environment }}
        ${{ if parameters.pool }}:
          pool: ${{ parameters.pool }}
        workspace:
          clean: all
        environment: splunk-${{ parameters.environment }}
        variables:
          - group: splunk-appinspect
          - group: ${{ parameters.target }}-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - ${{ parameters.steps }}
                - template: acs-cli.yml
                - ${{ if eq(length(parameters.deploySteps), 0) }}:
                  - template: deploy.yml
                    parameters:
                      environment: ${{ parameters.environment }}
                      packageDirectory: ${{ parameters.packageDirectory }}
                      compare: false
                      uninstall: ${{ parameters.uninstall }}
                - ${{ parameters.deploySteps }}
