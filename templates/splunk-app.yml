# Shared release pipeline for Splunk app repos. Each app repo extends this file
# (see example/azure-pipelines.yml). The pipeline derives app-specific values
# from the repo.
parameters:
  - name: importFromNonprod
    type: boolean
    default: false
  - name: importFromProd
    type: boolean
    default: false
  - name: skipLookups
    type: boolean
    default: true
  - name: skipLookupBackups
    type: boolean
    default: true
  - name: pool
    type: object
    default:
      vmImage: ubuntu-latest
  - name: setup
    type: stepList
    default:
      - checkout: tools
        path: tools
      - template: python.yml

stages:
  - ${{ if or(parameters.importFromNonprod, parameters.importFromProd) }}:
    # One import stage per checked environment; each opens its own pull request.
    - ${{ each env in split(format('{0} {1}', iif(parameters.importFromNonprod, 'nonprod', ''), iif(parameters.importFromProd, 'prod', '')), ' ') }}:
      - ${{ if ne(env, '') }}:
        - stage: import_${{ env }}
          displayName: Import from the ${{ env }} ITSI search head
          dependsOn: []
          jobs:
            - job: import
              displayName: Export the app from the ${{ env }} ITSI search head and open a pull request
              pool: ${{ parameters.pool }}
              workspace:
                clean: all
              variables:
                - group: splunk-itsi-${{ env }}
              steps:
                - checkout: self
                  path: app
                  persistCredentials: true
                - ${{ parameters.setup }}
                - template: diff-tools.yml
                  parameters:
                    includePackagingToolkit: true
                - script: python ../tools/release.py package
                  workingDirectory: $(Pipeline.Workspace)/app
                  displayName: Package main app
                - template: acs-cli.yml
                - template: import-steps.yml
                  parameters:
                    environment: ${{ env }}
                    flags: ${{ iif(parameters.skipLookups, '--skip-lookups', '') }} ${{ iif(parameters.skipLookupBackups, '--skip-lookup-backups', '') }}
  - ${{ else }}:
    - stage: build
      displayName: Build
      jobs:
        - job: build
          displayName: Package the app
          pool: ${{ parameters.pool }}
          workspace:
            clean: all
          steps:
            - checkout: self
              path: app
              persistCredentials: true
            - ${{ parameters.setup }}
            - script: python $(Pipeline.Workspace)/tools/release.py plan
              displayName: Show stage plan
            - template: diff-tools.yml
              parameters:
                includePackagingToolkit: true
            - script: python ../tools/release.py bump
              name: bump
              workingDirectory: $(Pipeline.Workspace)/app
              displayName: Bump PR version and manifest
              condition: eq(variables['Build.Reason'], 'PullRequest')
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            - script: python ../tools/release.py package
              workingDirectory: $(Pipeline.Workspace)/app
              displayName: Package app
              condition: and(succeeded(), ne(variables['bump.bumped'], 'true'))
            - publish: $(Pipeline.Workspace)/app/dist
              displayName: Publish the package artifact (dist)
              artifact: dist
              condition: and(succeeded(), ne(variables['bump.bumped'], 'true'))

    - stage: appinspect
      displayName: AppInspect
      dependsOn: build
      condition: and(succeeded(), ne(dependencies.build.outputs['build.bump.bumped'], 'true'))
      variables:
        - group: splunk-appinspect
      jobs:
        - job: appinspect
          displayName: Run AppInspect on the package
          pool: ${{ parameters.pool }}
          workspace:
            clean: all
          steps:
            - template: dist-package.yml
              parameters:
                setup: ${{ parameters.setup }}
            - script: python $(Pipeline.Workspace)/tools/release.py appinspect $(Pipeline.Workspace)/dist
              displayName: Run AppInspect
              env: # secrets reach scripts only when mapped
                SPLUNK_PASSWORD: $(SPLUNK_PASSWORD)
            - task: CopyFiles@2
              displayName: Collect AppInspect reports
              inputs:
                SourceFolder: $(Pipeline.Workspace)/dist
                Contents: appinspect-report.*
                TargetFolder: $(Pipeline.Workspace)/appinspect-report
              condition: succeededOrFailed()
            # Each job attempt publishes its own artifact.
            - publish: $(Pipeline.Workspace)/appinspect-report
              displayName: Publish the AppInspect report artifact
              artifact: appinspect-report-$(System.JobAttempt)
              condition: succeededOrFailed()
            - script: python -m json.tool $(Pipeline.Workspace)/appinspect-report/appinspect-report.json
              displayName: Show AppInspect JSON report
              condition: succeededOrFailed()
            - script: python $(Pipeline.Workspace)/tools/release.py appinspect-link
              displayName: Show AppInspect HTML report link
              env:
                SYSTEM_COLLECTIONURI: $(System.CollectionUri)
                SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
                BUILD_BUILDID: $(Build.BuildId)
              condition: succeededOrFailed()

    - template: compare-stage.yml
      parameters:
        name: nonproddiff
        displayName: Compare with nonprod
        environment: nonprod
        dependsOn: appinspect
        condition: and(succeeded(), or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
        pool: ${{ parameters.pool }}
        packageDirectory: $(Pipeline.Workspace)/dist
        steps:
          - template: dist-package.yml
            parameters:
              setup: ${{ parameters.setup }}

    - template: deploy-stage.yml
      parameters:
        name: nonprod
        displayName: Deploy to nonprod
        environment: nonprod
        dependsOn: nonproddiff
        condition: and(succeeded(), or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
        pool: ${{ parameters.pool }}
        packageDirectory: $(Pipeline.Workspace)/dist
        steps:
          - template: dist-package.yml
            parameters:
              setup: ${{ parameters.setup }}

    - template: compare-stage.yml
      parameters:
        name: proddiff
        displayName: Compare with prod
        environment: prod
        dependsOn: nonprod
        condition: and(succeeded(), or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
        pool: ${{ parameters.pool }}
        packageDirectory: $(Pipeline.Workspace)/dist
        steps:
          - template: dist-package.yml
            parameters:
              setup: ${{ parameters.setup }}

    - stage: release
      displayName: Release
      dependsOn: proddiff
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
        - job: release
          displayName: Tag and publish to the splunk-apps feed
          pool: ${{ parameters.pool }}
          workspace:
            clean: all
          steps:
            - checkout: self
              path: app
              persistCredentials: true
            - template: dist-package.yml
              parameters:
                setup: ${{ parameters.setup }}
            - script: python ../tools/release.py tag
              workingDirectory: $(Pipeline.Workspace)/app
              displayName: Tag the release version
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            - task: UniversalPackages@0
              displayName: Publish the package to the splunk-apps feed
              condition: and(succeeded(), ne(variables['PACKAGE_PUBLISHED'], 'true'))
              inputs:
                command: publish
                publishDirectory: $(Pipeline.Workspace)/dist
                feedsToUsePublish: internal
                vstsFeedPublish: $(System.TeamProject)/splunk-apps
                vstsFeedPackagePublish: $(APP_ID)
                versionOption: custom
                versionPublish: $(APP_VERSION)

    # Waits for the splunk-prod approval; a timed-out approval skips this stage. The proddiff stage runs the prod compare.
    - template: deploy-stage.yml
      parameters:
        name: prod
        displayName: Deploy to prod
        environment: prod
        dependsOn: release
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool: ${{ parameters.pool }}
        packageDirectory: $(Pipeline.Workspace)/dist
        steps:
          - template: dist-package.yml
            parameters:
              setup: ${{ parameters.setup }}
