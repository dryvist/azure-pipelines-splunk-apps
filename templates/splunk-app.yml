# Shared release pipeline for every Splunk app repo. App repos only `extends`
# this file (see example/azure-pipelines.yml); everything app-specific is
# derived from the repo itself.
parameters:
  - name: pool
    type: object
    default:
      vmImage: ubuntu-latest
  - name: prod
    type: boolean
    default: false
  - name: setup
    type: stepList
    default:
      - checkout: tools
        path: tools
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"

stages:
  - stage: build
    jobs:
      - job: build
        pool: ${{ parameters.pool }}
        steps:
          - checkout: self
            path: app
            persistCredentials: true
          - ${{ parameters.setup }}
          - script: python -m pip install --quiet splunk-packaging-toolkit
            displayName: Install slim
          - script: python ../tools/release.py bump
            workingDirectory: $(Pipeline.Workspace)/app
            displayName: Bump PR version and manifest
            condition: eq(variables['Build.Reason'], 'PullRequest')
          - script: python ../tools/release.py package
            workingDirectory: $(Pipeline.Workspace)/app
            displayName: Package app
          - publish: $(Pipeline.Workspace)/app/dist
            artifact: dist

  - stage: appinspect
    dependsOn: build
    variables:
      - group: splunk-appinspect
    jobs:
      - job: appinspect
        pool: ${{ parameters.pool }}
        steps:
          - ${{ parameters.setup }}
          - download: current
            artifact: dist
          - script: >-
              python $(Pipeline.Workspace)/tools/release.py appinspect
              $(Pipeline.Workspace)/dist
            displayName: Run AppInspect
            env: # secrets reach scripts only when mapped
              SPLUNK_PASSWORD: $(SPLUNK_PASSWORD)
          - script: |
              mkdir -p "$(Pipeline.Workspace)/appinspect-report"
              for ext in html json; do
                report="$(Pipeline.Workspace)/dist/appinspect-report.$ext"
                if [ -f "$report" ]; then
                  cp "$report" "$(Pipeline.Workspace)/appinspect-report/"
                fi
              done
            displayName: Collect AppInspect reports
            condition: succeededOrFailed()
          - publish: $(Pipeline.Workspace)/appinspect-report
            artifact: appinspect-report
            condition: succeededOrFailed()

  - stage: nonprod
    dependsOn: appinspect
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: deploy
        pool: ${{ parameters.pool }}
        environment: splunk-nonprod
        variables:
          - group: splunk-appinspect
          - group: splunk-nonprod
        strategy:
          runOnce:
            deploy:
              steps:
                - ${{ parameters.setup }}
                - download: current
                  artifact: dist
                - script: >-
                    python $(Pipeline.Workspace)/tools/release.py deploy
                    $(Pipeline.Workspace)/dist
                  displayName: Deploy to nonprod via ACS
                  env:
                    SPLUNK_PASSWORD: $(SPLUNK_PASSWORD)
                    ACS_TOKEN: $(ACS_TOKEN)

  - ${{ if eq(parameters.prod, true) }}:
      - stage: prod
        dependsOn: appinspect
        condition: >-
          and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        jobs:
          - deployment: deploy
            pool: ${{ parameters.pool }}
            environment: splunk-prod
            variables:
              - group: splunk-appinspect
              - group: splunk-prod
            strategy:
              runOnce:
                deploy:
                  steps:
                    - ${{ parameters.setup }}
                    - download: current
                      artifact: dist
                    - script: >-
                        python $(Pipeline.Workspace)/tools/release.py deploy
                        $(Pipeline.Workspace)/dist
                      displayName: Deploy to prod via ACS
                      env:
                        SPLUNK_PASSWORD: $(SPLUNK_PASSWORD)
                        ACS_TOKEN: $(ACS_TOKEN)
