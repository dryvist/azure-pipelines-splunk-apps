# Shared per-package steps for app validation and deployment.
parameters:
  - name: environment
    type: string
  - name: packageDirectory
    type: string
  - name: compare
    type: boolean
    default: true
  - name: install
    type: boolean
    default: true
  - name: uninstall
    type: boolean
    default: false
  - name: reverse
    type: boolean
    default: false

steps:
  - template: acs-step.yml
    parameters:
      command: '"$(Pipeline.Workspace)/tools/release.py" status'
      displayName: Check stack status before deploy
  - ${{ if eq(parameters.compare, true) }}:
      - template: acs-step.yml
        parameters:
          command: '"$(Pipeline.Workspace)/tools/release.py" export "$(Pipeline.Workspace)/${{ parameters.environment }}-export" "${{ parameters.packageDirectory }}"'
          displayName: Export this app from ${{ parameters.environment }} via ACS
      - template: compare-steps.yml
        parameters:
          release: '"$(Pipeline.Workspace)/tools/release.py"'
          target: '"$(Pipeline.Workspace)/${{ parameters.environment }}-export/$(APP_ID)"'
          source: '"${{ parameters.packageDirectory }}"'
          out: '"$(Pipeline.Workspace)/${{ parameters.environment }}-diff/$(APP_ID)"'
          label: ${{ parameters.environment }} with this package
          reverse: ${{ parameters.reverse }}
      - publish: $(Pipeline.Workspace)/${{ parameters.environment }}-diff/$(APP_ID)
        displayName: Publish the ${{ parameters.environment }} compare artifact
        artifact: ${{ parameters.environment }}-diff-$(APP_ID)-$(System.JobAttempt)
  - ${{ if eq(parameters.install, true) }}:
      - ${{ if eq(parameters.uninstall, true) }}:
          - template: acs-step.yml
            parameters:
              command: '"$(Pipeline.Workspace)/tools/release.py" uninstall "${{ parameters.packageDirectory }}"'
              displayName: Uninstall the app from ${{ parameters.environment }} via ACS
      - template: acs-step.yml
        parameters:
          command: '"$(Pipeline.Workspace)/tools/release.py" deploy "${{ parameters.packageDirectory }}"'
          displayName: Deploy to ${{ parameters.environment }} via ACS
          additionalEnv:
            SPLUNK_USERNAME: $(SPLUNK_USERNAME)
            SPLUNK_PASSWORD: $(SPLUNK_PASSWORD)
      - template: acs-step.yml
        parameters:
          command: '"$(Pipeline.Workspace)/tools/release.py" wait-version "${{ parameters.packageDirectory }}"'
          displayName: Wait for the deployed version
      - template: acs-step.yml
        parameters:
          command: '"$(Pipeline.Workspace)/tools/release.py" status'
          displayName: Check stack status after deploy
