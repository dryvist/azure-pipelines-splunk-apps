# Shared app comparison steps.
parameters:
  - name: release
    type: string
    default: $(Pipeline.Workspace)/tools/release.py
  - name: target
    type: string
  - name: source
    type: string
  - name: out
    type: string
  - name: label
    type: string
  - name: reverse
    type: boolean
    default: false

steps:
  - script: python ${{ parameters.release }} tree ${{ parameters.target }} ${{ parameters.source }} ${{ parameters.out }}${{ iif(parameters.reverse, ' --reverse', '') }}
    displayName: Compare ${{ parameters.label }} (file tree, local and default)
  - script: python ${{ parameters.release }} local-diff ${{ parameters.target }} ${{ parameters.source }} ${{ parameters.out }}${{ iif(parameters.reverse, ' --reverse', '') }}
    displayName: Compare ${{ parameters.label }} (local files vs default)
  - script: python ${{ parameters.release }} diff ${{ parameters.target }} ${{ parameters.source }} ${{ parameters.out }}${{ iif(parameters.reverse, ' --reverse', '') }}
    displayName: Compare ${{ parameters.label }} (merged defaults)
