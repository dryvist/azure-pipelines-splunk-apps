/g><g class="cGFnZS5zdWJ0aXRsZV9yb3cuc3VidGl0bGU= subtitle"><g class="shape" ></g><text x="498" y="84" fill="#475467" class="text" style="text-anchor:middle;font-size:15px"><tspan x="498" dy="0">Each app: compare, approve, install;</tspan><tspan x="498" dy="17">one optional restart when selected</tspan></text></g><g class="cGFnZS5zdWJ0aXRsZV9yb3cucGFkX3JpZ2h0" style='opacity:0'><g class="shape" ></g></g><g class="cGFnZS5maXJzdC5zZWxlY3Rpb24= card"><g class="shape" ><rect x="74" y="172" width="190" height="74" rx="8" stroke="#CBD5E1" fill="#FFFFFF" style="stroke-width:1;" /></g><text x="169" y="207" fill="#101828" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="169" dy="0">Select environment</tspan><tspan x="169" dy="17">and app IDs</tspan></text></g><g class="cGFnZS5maXJzdC5jb21wYXJl card"><g class="shape" ><rect x="334" y="165" width="210" height="89" rx="8" stroke="#CBD5E1" fill="#FFFFFF" style="stroke-width:1;" /></g><text x="439" y="200" fill="#101828" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="439" dy="0">Compare &lt;app&gt; stage:</tspan><tspan x="439" dy="16.333333">download, export,</tspan><tspan x="439" dy="16.333333">compare (no install)</tspan></text></g><g class="cGFnZS5maXJzdC5yZXZpZXc= card exception"><g class="shape" ><rect x="614" y="165" width="210" height="89" rx="8" stroke="#B54708" fill="#FFF7ED" style="stroke-width:2;" /></g><text x="719" y="200" fill="#101828" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="719" dy="0">Review the compare</tspan><tspan x="719" dy="16.333333">then approve the</tspan><tspan x="719" dy="16.333333">Deploy &lt;app&gt; stage</tspan></text></g><g class="cGFnZS5zZWNvbmQuaW5zdGFsbA== card emphasis"><g class="shape" ><rect x="354" y="475" width="210" height="89" rx="8" stroke="#0054A3" fill="#EFF6FF" style="stroke-width:2;" /></g><text x="459" y="510" fill="#101828" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="459" dy="0">Install &lt;app&gt; job:</tspan><tspan x="459" dy="16.333333">compare again,</tspan><tspan x="459" dy="16.333333">install via ACS</tspan></text></g><g class="cGFnZS5zZWNvbmQud2FpdA== card"><g class="shape" ><rect x="74" y="482" width="210" height="74" rx="8" stroke="#CBD5E1" fill="#FFFFFF" style="stroke-width:1;" /></g><text x="179" y="517" fill="#101828" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="179" dy="0">Wait for the version,</tspan><tspan x="179" dy="17">check status</tspan></text></g><g class="cGFnZS5zZWNvbmQubG9jaw== card ghost"><g class="shape" ><rect x="354" y="366" width="210" height="89" rx="8" stroke="#475467" fill="transparent" style="stroke-width:1;stroke-dasharray:5.000000,5.000000;" /></g><text x="459" y="401" fill="#475467" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="459" dy="0">Exclusive lock:</tspan><tspan x="459" dy="16.333333">one app installs</tspan><tspan x="459" dy="16.333333">at a time</tspan></text></g><g class="cGFnZS50aGlyZC5hcHByb3ZlX3Jlc3RhcnQ= card exception"><g class="shape" ><rect x="74" y="676" width="210" height="89" rx="8" stroke="#B54708" fill="#FFF7ED" style="stroke-width:2;" /></g><text x="179" y="711" fill="#101828" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="179" dy="0">Optional Restart stage</tspan><tspan x="179" dy="16.333333">when checked with</tspan><tspan x="179" dy="16.333333">app IDs</tspan></text></g><g class="cGFnZS50aGlyZC5yZXN0YXJ0 card emphasis"><g class="shape" ><rect x="354" y="683" width="210" height="74" rx="8" stroke="#0054A3" fill="#EFF6FF" style="stroke-width:2;" /></g><text x="459" y="718" fill="#101828" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="459" dy="0">Restart only if ACS</tspan><tspan x="459" dy="17">reports it is required</tspan></text></g><g class="cGFnZS50aGlyZC5maW5hbA== card"><g class="shape" ><rect x="634" y="683" width="210" height="74" rx="8" stroke="#CBD5E1" fill="#FFFFFF" style="stroke-wid