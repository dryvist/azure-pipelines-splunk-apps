# Manually export apps from one environment and compare them with another.
trigger: none
pr: none

parameters:
  - name: source
    displayName: Source - environment whose apps are compared (files only here show as added)
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: target
    displayName: Target - environment compared against (files only here show as removed)
    type: string
    default: prod
    values:
      - nonprod
      - prod
  - name: groupPrefix
    displayName: Variable groups - splunk uses splunk-<env>, splunk-itsi uses splunk-itsi-<env>
    type: string
    default: splunk
    values:
      - splunk
      - splunk-itsi
  - name: apps
    type: string
    displayName: App IDs separated by spaces, or all (empty also means all)
    default: all

jobs:
  - ${{ each side in split('source target', ' ') }}:
      - job: ${{ side }}
        workspace:
          clean: all
        variables:
          - group: ${{ parameters.groupPrefix }}-${{ parameters[side] }}
        steps:
          - template: ../templates/python.yml
          - template: ../templates/acs-cli.yml
            parameters:
              releaseScript: $(Build.SourcesDirectory)/release.py
          - template: ../templates/acs-step.yml
            parameters:
              command: release.py export $(Pipeline.Workspace)/${{ parameters[side] }}-export ${{ iif(in(lower(trim(parameters.apps)), '', 'all'), '--custom', parameters.apps) }}
              displayName: Export apps from ${{ parameters[side] }}
          - publish: $(Pipeline.Workspace)/${{ parameters[side] }}-export
            artifact: ${{ parameters[side] }}-export

  - job: compare
    workspace:
      clean: all
    dependsOn: [source, target]
    steps:
      - template: ../templates/python.yml
      - download: current
      - template: ../templates/diff-tools.yml
      - template: ../templates/compare-steps.yml
        parameters:
          release: release.py
          target: $(Pipeline.Workspace)/${{ parameters.target }}-export
          source: $(Pipeline.Workspace)/${{ parameters.source }}-export
          out: $(Pipeline.Workspace)/compare
          label: ${{ parameters.target }} with ${{ parameters.source }}
      - publish: $(Pipeline.Workspace)/compare
        artifact: compare
