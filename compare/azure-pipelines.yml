# Manually export apps from one environment and compare them with another.
trigger: none
pr: none

parameters:
  - name: source
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: target
    type: string
    default: prod
    values:
      - nonprod
      - prod
  - name: groupPrefix
    type: string
    default: splunk
    values:
      - splunk
      - splunk-itsi
  - name: apps
    type: string
    displayName: App IDs, separated by spaces
    default: ''

jobs:
  - job: source
    workspace:
      clean: all
    variables:
      - group: ${{ parameters.groupPrefix }}-${{ parameters.source }}
    steps:
      - template: ../templates/python.yml
      - template: ../templates/acs-cli.yml
        parameters:
          releaseScript: $(Build.SourcesDirectory)/release.py
      - ${{ if eq(parameters.apps, '') }}:
          - template: ../templates/acs-step.yml
            parameters:
              command: release.py export $(Pipeline.Workspace)/${{ parameters.source }}-export --custom
              displayName: Export all custom apps from ${{ parameters.source }}
      - ${{ if ne(parameters.apps, '') }}:
          - template: ../templates/acs-step.yml
            parameters:
              command: release.py export $(Pipeline.Workspace)/${{ parameters.source }}-export ${{ parameters.apps }}
              displayName: Export selected apps from ${{ parameters.source }}
      - publish: $(Pipeline.Workspace)/${{ parameters.source }}-export
        artifact: ${{ parameters.source }}-export

  - job: target
    workspace:
      clean: all
    variables:
      - group: ${{ parameters.groupPrefix }}-${{ parameters.target }}
    steps:
      - template: ../templates/python.yml
      - template: ../templates/acs-cli.yml
        parameters:
          releaseScript: $(Build.SourcesDirectory)/release.py
      - ${{ if eq(parameters.apps, '') }}:
          - template: ../templates/acs-step.yml
            parameters:
              command: release.py export $(Pipeline.Workspace)/${{ parameters.target }}-export --custom
              displayName: Export all custom apps from ${{ parameters.target }}
      - ${{ if ne(parameters.apps, '') }}:
          - template: ../templates/acs-step.yml
            parameters:
              command: release.py export $(Pipeline.Workspace)/${{ parameters.target }}-export ${{ parameters.apps }}
              displayName: Export selected apps from ${{ parameters.target }}
      - publish: $(Pipeline.Workspace)/${{ parameters.target }}-export
        artifact: ${{ parameters.target }}-export

  - job: compare
    workspace:
      clean: all
    dependsOn: [source, target]
    steps:
      - template: ../templates/python.yml
      - download: current
      - template: ../templates/diff-tools.yml
      - template: ../templates/compare-steps.yml
        parameters:
          release: release.py
          target: $(Pipeline.Workspace)/${{ parameters.target }}-export
          source: $(Pipeline.Workspace)/${{ parameters.source }}-export
          out: $(Pipeline.Workspace)/compare
          label: ${{ parameters.target }} with ${{ parameters.source }}
      - publish: $(Pipeline.Workspace)/compare
        artifact: compare
