# Manually export apps from one environment and compare them with another.
trigger: none
pr: none

parameters:
  - name: source
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: target
    type: string
    default: prod
    values:
      - nonprod
      - prod
  - name: groupPrefix
    type: string
    default: splunk
    values:
      - splunk
      - splunk-itsi
  - name: apps
    type: string
    displayName: App IDs, separated by spaces
    default: ''

jobs:
  - job: source
    workspace:
      clean: all
    variables:
      - group: ${{ parameters.groupPrefix }}-${{ parameters.source }}
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - template: ../templates/acs-cli.yml
        parameters:
          releaseScript: $(Build.SourcesDirectory)/release.py
      - ${{ if eq(parameters.apps, '') }}:
          - script: python release.py export $(Pipeline.Workspace)/${{ parameters.source }}-export --custom
            displayName: Export all custom apps from ${{ parameters.source }}
            env:
              SPLUNK_STACK: $(SPLUNK_STACK)
              SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
              STACK_TOKEN: $(ACS_TOKEN)
      - ${{ if ne(parameters.apps, '') }}:
          - script: python release.py export $(Pipeline.Workspace)/${{ parameters.source }}-export ${{ parameters.apps }}
            displayName: Export selected apps from ${{ parameters.source }}
            env:
              SPLUNK_STACK: $(SPLUNK_STACK)
              SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
              STACK_TOKEN: $(ACS_TOKEN)
      - publish: $(Pipeline.Workspace)/${{ parameters.source }}-export
        artifact: ${{ parameters.source }}-export

  - job: target
    workspace:
      clean: all
    variables:
      - group: ${{ parameters.groupPrefix }}-${{ parameters.target }}
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - template: ../templates/acs-cli.yml
        parameters:
          releaseScript: $(Build.SourcesDirectory)/release.py
      - ${{ if eq(parameters.apps, '') }}:
          - script: python release.py export $(Pipeline.Workspace)/${{ parameters.target }}-export --custom
            displayName: Export all custom apps from ${{ parameters.target }}
            env:
              SPLUNK_STACK: $(SPLUNK_STACK)
              SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
              STACK_TOKEN: $(ACS_TOKEN)
      - ${{ if ne(parameters.apps, '') }}:
          - script: python release.py export $(Pipeline.Workspace)/${{ parameters.target }}-export ${{ parameters.apps }}
            displayName: Export selected apps from ${{ parameters.target }}
            env:
              SPLUNK_STACK: $(SPLUNK_STACK)
              SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
              STACK_TOKEN: $(ACS_TOKEN)
      - publish: $(Pipeline.Workspace)/${{ parameters.target }}-export
        artifact: ${{ parameters.target }}-export

  - job: compare
    workspace:
      clean: all
    dependsOn: [source, target]
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - download: current
      - script: python -m pip install --quiet ksconf==0.13.10 splunk-sdk==2.1.0
        displayName: Install diff dependencies
      - script: python release.py local-diff $(Pipeline.Workspace)/${{ parameters.target }}-export $(Pipeline.Workspace)/${{ parameters.source }}-export $(Pipeline.Workspace)/compare
        displayName: Compare ${{ parameters.target }} with ${{ parameters.source }} (local files vs default)
      - script: python release.py diff $(Pipeline.Workspace)/${{ parameters.target }}-export $(Pipeline.Workspace)/${{ parameters.source }}-export $(Pipeline.Workspace)/compare
        displayName: Compare ${{ parameters.target }} with ${{ parameters.source }} (merged defaults)
      - publish: $(Pipeline.Workspace)/compare
        artifact: compare
