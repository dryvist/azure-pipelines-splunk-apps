# Manual run: export the listed apps from nonprod and prod, then report every
# change a deploy from nonprod to prod would make.
trigger: none
pr: none

parameters:
  - name: target
    type: string
    default: splunk
    values:
      - splunk
      - splunk-itsi
  - name: apps
    type: string
    displayName: App IDs, separated by spaces

jobs:
  - ${{ each env in split('nonprod,prod', ',') }}:
      - job: ${{ env }}
        workspace:
          clean: all
        variables:
          - group: ${{ parameters.target }}-${{ env }}
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.13"
          - template: ../templates/acs-cli.yml
            parameters:
              releaseScript: $(Build.SourcesDirectory)/release.py
          - script: python release.py export $(Pipeline.Workspace)/${{ env }}-export ${{ parameters.apps }}
            displayName: Export apps from ${{ env }} via ACS
            env:
              SPLUNK_STACK: $(SPLUNK_STACK)
              SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
              STACK_TOKEN: $(ACS_TOKEN)
          - publish: $(Pipeline.Workspace)/${{ env }}-export
            artifact: ${{ env }}-export

  - job: compare
    workspace:
      clean: all
    dependsOn: [nonprod, prod]
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - download: current
      - script: python -m pip install --quiet ksconf==0.13.10 splunk-sdk==2.1.0
        displayName: Install diff dependencies
      - script: python release.py diff $(Pipeline.Workspace)/prod-export $(Pipeline.Workspace)/nonprod-export $(Pipeline.Workspace)/compare
        displayName: Compare prod with nonprod
      - publish: $(Pipeline.Workspace)/compare
        artifact: compare
