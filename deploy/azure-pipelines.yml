trigger: none
pr: none

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: apps
    type: string
    default: ''
    displayName: App IDs, separated by spaces
  - name: uninstall
    type: boolean
    default: false
    displayName: Uninstall each app completely before installing it (removes its local settings)
  - name: restart
    type: boolean
    default: false
    displayName: Restart the stack after the deploys if a restart is required

stages:
  - ${{ each app in split(parameters.apps, ' ') }}:
      - ${{ if ne(app, '') }}:
          - stage: compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
            displayName: Compare ${{ app }} with ${{ parameters.environment }}
            dependsOn: []
            jobs:
              # <environment> is the search head the install replaces; itsi-<environment> is the ITSI search head.
              - ${{ each side in split(format('{0} itsi-{0}', parameters.environment), ' ') }}:
                  - job: compare_${{ replace(side, '-', '_') }}
                    displayName: Compare ${{ app }} with ${{ side }} (no install)
                    workspace:
                      clean: all
                    variables:
                      - group: splunk-${{ side }}
                    steps:
                      - template: ../templates/deploy-app.yml
                        parameters:
                          app: ${{ app }}
                          environment: ${{ side }}
                          install: false
          - stage: deploy_${{ replace(replace(app, '-', '_'), '.', '_') }}
            displayName: Deploy ${{ app }} to ${{ parameters.environment }}
            dependsOn: compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
            lockBehavior: sequential
            variables:
              - group: splunk-appinspect
              - group: splunk-${{ parameters.environment }}
            jobs:
              - deployment: deploy
                displayName: Install ${{ app }} on ${{ parameters.environment }}
                workspace:
                  clean: all
                environment: splunk-${{ parameters.environment }}
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - template: ../templates/deploy-app.yml
                          parameters:
                            app: ${{ app }}
                            environment: ${{ parameters.environment }}
                            install: true
                            uninstall: ${{ parameters.uninstall }}
  - ${{ if and(parameters.restart, ne(trim(parameters.apps), '')) }}:
    - stage: restart
      displayName: Restart ${{ parameters.environment }} if required
      dependsOn:
        - ${{ each app in split(parameters.apps, ' ') }}:
            - ${{ if ne(app, '') }}:
                - deploy_${{ replace(replace(app, '-', '_'), '.', '_') }}
      condition: succeededOrFailed()
      lockBehavior: sequential
      variables:
        - group: splunk-${{ parameters.environment }}
      jobs:
        - deployment: restart
          displayName: Restart ${{ parameters.environment }} if required and check status
          workspace:
            clean: all
          environment: splunk-${{ parameters.environment }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    path: tools
                  - template: ../templates/python.yml
                  - template: ../templates/acs-cli.yml
                  - template: ../templates/acs-step.yml
                    parameters:
                      command: '"$(Pipeline.Workspace)/tools/release.py" restart'
                      displayName: Restart the current stack
                  - template: ../templates/acs-step.yml
                    parameters:
                      command: '"$(Pipeline.Workspace)/tools/release.py" status'
                      displayName: Check stack status after restart
