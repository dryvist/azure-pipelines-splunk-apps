trigger: none
pr: none

parameters:
  - name: environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: apps
    type: string
    default: ''
    displayName: App IDs, separated by spaces

jobs:
  - deployment: deploy
    workspace:
      clean: all
    environment: splunk-${{ parameters.environment }}
    variables:
      - group: splunk-appinspect
      - group: splunk-${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              path: tools
            - template: ../templates/python.yml
            - template: ../templates/diff-tools.yml
            - template: ../templates/acs-cli.yml
            - ${{ each app in split(parameters.apps, ' ') }}:
              - ${{ if ne(app, '') }}:
                - task: UniversalPackages@0
                  displayName: Download ${{ lower(app) }} from the splunk-apps feed
                  inputs:
                    command: download
                    feedsToUse: internal
                    vstsFeed: $(System.TeamProject)/splunk-apps
                    vstsFeedPackage: ${{ lower(app) }}
                    vstsPackageVersion: '*'
                    downloadDirectory: $(Pipeline.Workspace)/packages/${{ lower(app) }}
                - template: ../templates/deploy.yml
                  parameters:
                    environment: ${{ parameters.environment }}
                    packageDirectory: $(Pipeline.Workspace)/packages/${{ lower(app) }}
            - template: ../templates/acs-step.yml
              parameters:
                command: '"$(Pipeline.Workspace)/tools/release.py" restart'
                displayName: Restart the current stack
            - template: ../templates/acs-step.yml
              parameters:
                command: '"$(Pipeline.Workspace)/tools/release.py" status'
                displayName: Check stack status after restart
