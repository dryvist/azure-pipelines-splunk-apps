trigger: none
pr: none

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: apps
    type: string
    default: ''
    displayName: App IDs, separated by spaces
  - name: uninstall
    type: boolean
    default: false
    displayName: DANGER - Uninstall each app first. PERMANENTLY DELETES ALL of its lookups (CSV files) and local settings
  - name: restart
    type: boolean
    default: false
    displayName: Restart both search heads - always after the uninstalls, after the installs only if required. Unchecked never restarts

stages:
  - ${{ each app in split(parameters.apps, ' ') }}:
      - ${{ if ne(app, '') }}:
          - template: ../templates/compare-stage.yml
            parameters:
              name: compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
              displayName: Compare ${{ app }} with ${{ parameters.environment }}
              environment: ${{ parameters.environment }}
              packageDirectory: $(Pipeline.Workspace)/packages/${{ lower(app) }}
              steps:
                - template: ../templates/feed-package.yml
                  parameters:
                    app: ${{ app }}
          - ${{ if parameters.uninstall }}:
            - template: ../templates/deploy-stage.yml
              parameters:
                name: uninstall_${{ replace(replace(app, '-', '_'), '.', '_') }}
                displayName: Uninstall ${{ app }} from ${{ parameters.environment }}
                environment: ${{ parameters.environment }}
                dependsOn: compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
                packageDirectory: $(Pipeline.Workspace)/packages/${{ lower(app) }}
                uninstall: true
                install: false
                steps:
                  - template: ../templates/feed-package.yml
                    parameters:
                      app: ${{ app }}
  # One restart after all uninstalls, before any install.
  - ${{ if and(parameters.restart, parameters.uninstall, ne(trim(parameters.apps), '')) }}:
    - template: ../templates/restart-stage.yml
      parameters:
        name: restart_uninstall
        displayName: Restart ${{ parameters.environment }} after the uninstalls
        environment: ${{ parameters.environment }}
        force: true
        dependsOn:
          - ${{ each app in split(parameters.apps, ' ') }}:
              - ${{ if ne(app, '') }}:
                  - uninstall_${{ replace(replace(app, '-', '_'), '.', '_') }}
  - ${{ each app in split(parameters.apps, ' ') }}:
      - ${{ if ne(app, '') }}:
          - template: ../templates/deploy-stage.yml
            parameters:
              name: deploy_${{ replace(replace(app, '-', '_'), '.', '_') }}
              displayName: Install ${{ app }} on ${{ parameters.environment }}
              environment: ${{ parameters.environment }}
              dependsOn:
                - compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
                - ${{ if and(parameters.restart, parameters.uninstall) }}:
                  - restart_uninstall
                - ${{ elseif parameters.uninstall }}:
                  - ${{ each uninstalled in split(parameters.apps, ' ') }}:
                    - ${{ if ne(uninstalled, '') }}:
                      - uninstall_${{ replace(replace(uninstalled, '-', '_'), '.', '_') }}
              packageDirectory: $(Pipeline.Workspace)/packages/${{ lower(app) }}
              steps:
                - template: ../templates/feed-package.yml
                  parameters:
                    app: ${{ app }}
  - ${{ if and(parameters.restart, ne(trim(parameters.apps), '')) }}:
    - template: ../templates/restart-stage.yml
      parameters:
        name: restart
        displayName: Restart ${{ parameters.environment }} if required
        environment: ${{ parameters.environment }}
        dependsOn:
          - ${{ each app in split(parameters.apps, ' ') }}:
              - ${{ if ne(app, '') }}:
                  - deploy_${{ replace(replace(app, '-', '_'), '.', '_') }}
