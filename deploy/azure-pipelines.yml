trigger: none
pr: none

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: apps
    type: string
    default: ''
    displayName: App IDs separated by ;
  - name: compare
    type: boolean
    default: true
    displayName: Compare each app with the environment first
  - name: uninstall
    type: boolean
    default: false
    displayName: DANGER - Uninstall each app first. PERMANENTLY DELETES ALL of its lookups (CSV files) and local settings
  - name: install
    type: boolean
    default: true
    displayName: Install each app
  - name: restart
    type: boolean
    default: false
    displayName: Restart both search heads at the end if required

variables:
  appIds: ${{ replace(replace(trim(parameters.apps), '; ', ';'), ' ', ';') }}

stages:
  - ${{ if ne(trim(parameters.apps), '') }}:
    - template: ../templates/release-missing-stage.yml
      parameters:
        apps: ${{ variables.appIds }}
  - ${{ each app in split(variables.appIds, ';') }}:
      - ${{ if and(ne(app, ''), parameters.compare) }}:
          - template: ../templates/compare-stage.yml
            parameters:
              name: compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
              displayName: Compare ${{ app }} with ${{ parameters.environment }}
              environment: ${{ parameters.environment }}
              dependsOn:
                - release_missing
              packageDirectory: $(Pipeline.Workspace)/packages/${{ lower(app) }}
              steps:
                - template: ../templates/feed-package.yml
                  parameters:
                    app: ${{ app }}
  - ${{ if and(parameters.uninstall, ne(trim(parameters.apps), '')) }}:
    - template: ../templates/deploy-stage.yml
      parameters:
        name: uninstall
        displayName: Uninstall apps from ${{ parameters.environment }}
        environment: ${{ parameters.environment }}
        dependsOn:
          - release_missing
          - ${{ if parameters.compare }}:
              - ${{ each app in split(variables.appIds, ';') }}:
                  - ${{ if ne(app, '') }}:
                      - compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
        packageDirectory: $(Pipeline.Workspace)/packages
        uninstall: true
        steps:
          - ${{ each app in split(variables.appIds, ';') }}:
              - ${{ if ne(app, '') }}:
                  - template: ../templates/feed-package.yml
                    parameters:
                      app: ${{ app }}
                      packageDirectory: $(Pipeline.Workspace)/packages
  # Restart after all uninstalls, before any install.
  - ${{ if and(parameters.uninstall, ne(trim(parameters.apps), '')) }}:
    - template: ../templates/restart-stage.yml
      parameters:
        name: restart_uninstall
        displayName: Restart ${{ parameters.environment }} if required after the uninstalls
        environment: ${{ parameters.environment }}
        dependsOn:
          - uninstall
  - ${{ if and(parameters.install, ne(trim(parameters.apps), '')) }}:
    - template: ../templates/deploy-stage.yml
      parameters:
        name: install
        displayName: Install apps on ${{ parameters.environment }}
        environment: ${{ parameters.environment }}
        dependsOn:
          - release_missing
          - ${{ if parameters.compare }}:
              - ${{ each app in split(variables.appIds, ';') }}:
                  - ${{ if ne(app, '') }}:
                      - compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
          - ${{ if parameters.uninstall }}:
              - restart_uninstall
        packageDirectory: $(Pipeline.Workspace)/packages
        steps:
          - ${{ each app in split(variables.appIds, ';') }}:
              - ${{ if ne(app, '') }}:
                  - template: ../templates/feed-package.yml
                    parameters:
                      app: ${{ app }}
                      packageDirectory: $(Pipeline.Workspace)/packages
  - ${{ if and(parameters.restart, parameters.install, ne(trim(parameters.apps), '')) }}:
    - template: ../templates/restart-stage.yml
      parameters:
        name: restart
        displayName: Restart ${{ parameters.environment }} if required after the installs
        environment: ${{ parameters.environment }}
        dependsOn:
          - install
