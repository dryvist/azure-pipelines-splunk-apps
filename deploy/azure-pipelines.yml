trigger: none
pr: none

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: apps
    type: string
    default: ''
    displayName: App IDs, separated by spaces
  - name: compare
    type: boolean
    default: true
    displayName: Compare each app with the environment first
  - name: uninstall
    type: boolean
    default: false
    displayName: DANGER - Uninstall each app first. PERMANENTLY DELETES ALL of its lookups (CSV files) and local settings
  - name: install
    type: boolean
    default: true
    displayName: Install each app
  - name: restart
    type: boolean
    default: false
    displayName: Restart both search heads at the end if required

stages:
  - ${{ each app in split(parameters.apps, ' ') }}:
      - ${{ if and(ne(app, ''), parameters.compare) }}:
          - template: ../templates/compare-stage.yml
            parameters:
              name: compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
              displayName: Compare ${{ app }} with ${{ parameters.environment }}
              environment: ${{ parameters.environment }}
              packageDirectory: $(Pipeline.Workspace)/packages/${{ lower(app) }}
              steps:
                - template: ../templates/feed-package.yml
                  parameters:
                    app: ${{ app }}
      - ${{ if and(ne(app, ''), parameters.uninstall) }}:
          - template: ../templates/deploy-stage.yml
            parameters:
              name: uninstall_${{ replace(replace(app, '-', '_'), '.', '_') }}
              displayName: Uninstall ${{ app }} from ${{ parameters.environment }}
              environment: ${{ parameters.environment }}
              dependsOn:
                - ${{ if parameters.compare }}:
                  - compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
              packageDirectory: $(Pipeline.Workspace)/packages/${{ lower(app) }}
              uninstall: true
              steps:
                - template: ../templates/feed-package.yml
                  parameters:
                    app: ${{ app }}
  # Restart after all uninstalls, before any install.
  - ${{ if and(parameters.uninstall, ne(trim(parameters.apps), '')) }}:
    - template: ../templates/restart-stage.yml
      parameters:
        name: restart_uninstall
        displayName: Restart ${{ parameters.environment }} if required after the uninstalls
        environment: ${{ parameters.environment }}
        dependsOn:
          - ${{ each app in split(parameters.apps, ' ') }}:
              - ${{ if ne(app, '') }}:
                  - uninstall_${{ replace(replace(app, '-', '_'), '.', '_') }}
  - ${{ each app in split(parameters.apps, ' ') }}:
      - ${{ if and(ne(app, ''), parameters.install) }}:
          - template: ../templates/deploy-stage.yml
            parameters:
              name: deploy_${{ replace(replace(app, '-', '_'), '.', '_') }}
              displayName: Install ${{ app }} on ${{ parameters.environment }}
              environment: ${{ parameters.environment }}
              dependsOn:
                - ${{ if parameters.compare }}:
                  - compare_${{ replace(replace(app, '-', '_'), '.', '_') }}
                - ${{ if parameters.uninstall }}:
                  - restart_uninstall
              packageDirectory: $(Pipeline.Workspace)/packages/${{ lower(app) }}
              steps:
                - template: ../templates/feed-package.yml
                  parameters:
                    app: ${{ app }}
  - ${{ if and(parameters.restart, parameters.install, ne(trim(parameters.apps), '')) }}:
    - template: ../templates/restart-stage.yml
      parameters:
        name: restart
        displayName: Restart ${{ parameters.environment }} if required after the installs
        environment: ${{ parameters.environment }}
        dependsOn:
          - ${{ each app in split(parameters.apps, ' ') }}:
              - ${{ if ne(app, '') }}:
                  - deploy_${{ replace(replace(app, '-', '_'), '.', '_') }}
