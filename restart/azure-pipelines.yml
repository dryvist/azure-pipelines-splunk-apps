# Manually restart the selected stack.
trigger: none
pr: none

parameters:
  - name: environment
    type: string
    default: nonprod
    values:
      - nonprod
      - prod
  - name: target
    type: string
    default: splunk
    values:
      - splunk
      - splunk-itsi

jobs:
  - job: restart
    workspace:
      clean: all
    variables:
      - group: ${{ parameters.target }}-${{ parameters.environment }}
    steps:
      - template: ../templates/python.yml
      - template: ../templates/acs-cli.yml
        parameters:
          releaseScript: $(Build.SourcesDirectory)/release.py
      - template: ../templates/acs-step.yml
        parameters:
          command: release.py status
          displayName: Check stack status before restart
      - template: ../templates/acs-step.yml
        parameters:
          command: release.py restart
          displayName: Restart the current stack
      - template: ../templates/acs-step.yml
        parameters:
          command: release.py status
          displayName: Check stack status after restart
